# Lima template of the throwaway VM used by harness/run-vm.sh (issue #45).
# Ubuntu 24.04 LTS arm64 cloud image pinned by digest, no host mounts (the
# packages are copied in with `limactl copy`), cloud-init provisioning installs
# Docker from the Ubuntu archive and OpenShell 0.1.3 from its pinned release deb.
minimumLimaVersion: 2.0.0

images:
- location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"
  digest: "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"

arch: aarch64
cpus: 4
memory: 6GiB
disk: 30GiB

# Nothing of the Mac is visible inside the VM.
mounts: []
# No containerd/nerdctl from Lima: Docker comes from provisioning.
containerd:
  system: false
  user: false
# Ports are reached from inside the VM only.
portForwards:
- guestIP: "0.0.0.0"
  guestPortRange: [1, 65535]
  proto: any
  ignore: true

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends docker.io logrotate openssl ca-certificates curl jq sudo
    systemctl enable --now docker
    # OpenShell 0.1.3: the release deb, checked against its published SHA-256
    deb=/var/cache/openshell_0.1.3-1_arm64.deb
    curl -fsSL --retry 3 -o "$deb" https://github.com/NVIDIA/OpenShell/releases/download/v0.1.3/openshell_0.1.3-1_arm64.deb
    echo "9ba7075bd293529ce780cf3993bccbab8fa201d8eabc43194a13c60a1ac5f76a  $deb" | sha256sum -c -
    apt-get install -y "$deb"
    touch /var/lib/tmb-vm-provisioned
