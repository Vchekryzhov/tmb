# Release on a v* tag (issue #44): package.yml builds and tests the deb/rpm
# packages and the tmb archives at the tag, then publish uploads them with
# SHA256SUMS to a GitHub release of that tag. workflow_dispatch is a dry run:
# it builds and tests, publish is skipped.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml # zizmor: ignore[self-repository] actionlint 1.7.12 cannot parse $/ yet
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  publish:
    needs: [package]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # plain vMAJOR.MINOR.PATCH only: a pre-release puts ~ and + into
          # package file names, and GitHub renames such assets, so they
          # would no longer match SHA256SUMS
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vMAJOR.MINOR.PATCH; nothing published" >&2; exit 1; }
          cd dist
          sha256sum -c SHA256SUMS
          # SHA256SUMS lists exactly the files that are published
          diff <(for f in *; do [ "$f" = SHA256SUMS ] || echo "$f"; done | sort) <(awk '{print $2}' SHA256SUMS | sort)
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Packages and client archives built from $TAG by the release workflow; verify with sha256sum -c SHA256SUMS." \
            ./*
